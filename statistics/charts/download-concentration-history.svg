<title id="download-concentration-history-title">Has concentration changed?</title>
<desc id="download-concentration-history-desc">Download concentration for today&apos;s fixed cohort of 135 packages, using complete calendar years. Known prepublication periods contribute zero; missing observations create gaps.</desc>
