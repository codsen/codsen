<text x="483" y="483" font-size="12" fill="#526a73" text-anchor="middle">Calendar year</text>
<text x="40" y="504" font-size="12" fill="#526a73" >Today&apos;s cohort is held fixed; packages not yet published in an earlier year contribute known zeros.</text>
<text x="40" y="526" font-size="12" fill="#526a73" >The cohort is not a reconstruction of the portfolio in each year. A whole-package fifth is rounded up.</text>
<text x="40" y="548" font-size="12" fill="#526a73" >Gaps mean incomplete or zero totals. Hollow markers retain archive-flagged suspected shared-zero days.</text>
