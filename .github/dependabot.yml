---
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Europe/London
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-node"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:37"
      timezone: Europe/London
    open-pull-requests-limit: 5
