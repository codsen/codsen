---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Assert the complete workspace set
        run: node ops/scripts/npm-release.js assert-workspaces --expected 111

      - name: Regenerate lect-managed package files
        run: npm run lect

      - name: Build packages
        run: npm run build -- '--filter=./packages/**'

      - name: Bootstrap @codsen/data
        run: npm run build -- '--filter=./data/**'

      - name: Regenerate repository data
        run: |
          npm run ci:generate:info
          npm run ci:generate:changelogs
          npm run ci:build:root-readme

      - name: Rebuild @codsen/data from regenerated sources
        run: npm run build -- '--filter=./data/**'

      - name: Verify complete and freshly compiled repository data
        run: npm run ci:verify:data

      - name: Check formatting and linting without changing files
        run: npm exec -- biome check .

      - name: Dry-run every npm package
        env:
          PACK_REPORT: ${{ runner.temp }}/npm-pack-dry-run.json
        run: |
          npm pack --dry-run --json --workspaces --ignore-scripts > "$PACK_REPORT"
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.PACK_REPORT, "utf8"));
            if (report.length !== 111) {
              throw new Error(`Expected 111 npm pack results, received ${report.length}`);
            }
          '

      - name: Verify generated files are current
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Archive built test inputs
        run: >-
          tar --create --gzip
          --file "${{ runner.temp }}/built-packages.tar.gz"
          packages/*/dist packages/*/types data/dist

      - name: Upload built test inputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ci-built-packages
          path: ${{ runner.temp }}/built-packages.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  library-compatibility:
    name: Libraries / Node ${{ matrix.node-version }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build and test Rollup-family libraries
        shell: bash
        run: |
          filters=()
          for config in packages/*/rollup.config.js; do
            package_dir=${config%/rollup.config.js}
            filters+=("--filter=./${package_dir}")
          done

          npm run turbo -- run build "${filters[@]}" --only
          npm run turbo -- run unit examples "${filters[@]}" --only

  cli-tests:
    name: CLI unit tests / Node 24
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Download built test inputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ci-built-packages
          path: ${{ runner.temp }}/built-packages

      - name: Restore built test inputs
        run: tar --extract --gzip --file "${{ runner.temp }}/built-packages/built-packages.tar.gz"

      - name: Run CLI unit tests
        shell: bash
        run: |
          filters=()
          for package_json in packages/*/package.json; do
            package_dir=${package_json%/package.json}
            if [[ ! -f "${package_dir}/rollup.config.js" ]]; then
              filters+=("--filter=./${package_dir}")
            fi
          done

          npm run turbo -- run unit "${filters[@]}" --only
