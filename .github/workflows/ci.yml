---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_node_matrix: ${{ steps.package_node_matrix.outputs.matrix }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          command -v shellcheck >/dev/null
          "$RUNNER_TEMP/actionlint" -color -shellcheck shellcheck

      - name: Set up Node and npm
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Lint maintained Markdown
        run: npm run lint:markdown

      - name: Assert the complete workspace set
        run: node ops/scripts/npm-release.js assert-workspaces

      - name: Regenerate lect-managed package files
        run: npm run lect

      - name: Build packages
        run: npm run build -- '--filter=./packages/**'

      - name: Bootstrap @codsen/data
        run: npm run build -- '--filter=./data/**'

      - name: Regenerate repository data
        run: |
          npm run ci:generate:info
          npm run ci:generate:changelogs
          npm run ci:build:root-readme

      - name: Rebuild @codsen/data from regenerated sources
        run: npm run build -- '--filter=./data/**'

      - name: Type-check TypeScript sources
        run: npm run typecheck

      - name: Verify complete and freshly compiled repository data
        run: npm run ci:verify:data

      - name: Run package examples on the root toolchain
        run: npm run turbo -- run examples --filter='./packages/**' --only

      - name: Enforce package coverage on the root toolchain
        run: npm run test:quality

      - name: Verify package Node compatibility policy
        run: npm run ci:verify:node-compatibility

      - name: Define package Node compatibility matrix
        id: package_node_matrix
        run: |
          package_node_matrix=$(node ops/scripts/verify-node-compatibility.js --github-actions-matrix)
          echo "matrix=$package_node_matrix" >> "$GITHUB_OUTPUT"

      - name: Check formatting, linting and assists without changing files
        run: npm exec -- biome ci --error-on-warnings .

      - name: Verify generated files are current
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Pack all Node compatibility artifacts
        run: >-
          node ops/scripts/package-node-compatibility.js pack
          --output "${{ runner.temp }}/package-node-artifacts"

      - name: Upload all Node compatibility artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ci-package-node-artifacts
          path: ${{ runner.temp }}/package-node-artifacts/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package-node-compatibility:
    name: All packages / Node ${{ matrix.node-major }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.package_node_matrix) }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up package runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Report the isolated runtime
        run: |
          node --version
          npm --version

      - name: Download package compatibility artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ci-package-node-artifacts
          path: ${{ runner.temp }}/package-node-artifacts

      - name: Install, import, smoke-test and unit-test every eligible package
        run: >-
          node ops/scripts/package-node-compatibility.js verify
          --artifacts "${{ runner.temp }}/package-node-artifacts"
          --node-major "${{ matrix.node-major }}"
          --unit-concurrency 4
