---
name: Release npm packages

on:
  push:
    branches: [main]
    paths:
      - .github/npm-release-plan.json

permissions:
  contents: read

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  pack:
    name: Verify and pack the exact release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      package_node_matrix: ${{ steps.package_node_matrix.outputs.matrix }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Lint maintained Markdown
        run: npm run lint:markdown

      - name: Assert the complete workspace set
        run: node ops/scripts/npm-release.js assert-workspaces --expected 111

      - name: Regenerate lect-managed package files
        run: npm run lect

      - name: Build packages
        run: npm run build -- '--filter=./packages/**'

      - name: Bootstrap @codsen/data
        run: npm run build -- '--filter=./data/**'

      - name: Regenerate repository data
        run: |
          npm run ci:generate:info
          npm run ci:generate:changelogs
          npm run ci:build:root-readme

      - name: Rebuild @codsen/data from regenerated sources
        run: npm run build -- '--filter=./data/**'

      - name: Verify complete and freshly compiled repository data
        run: npm run ci:verify:data

      - name: Verify package Node compatibility policy
        run: npm run ci:verify:node-compatibility

      - name: Define package Node compatibility matrix
        id: package_node_matrix
        run: |
          package_node_matrix=$(node ops/scripts/verify-node-compatibility.js --github-actions-matrix)
          echo "matrix=$package_node_matrix" >> "$GITHUB_OUTPUT"

      - name: Check formatting, linting and assists without changing files
        run: npm exec -- biome ci --error-on-warnings .

      - name: Verify the release commit is reproducible
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Archive built test inputs
        run: >-
          tar --create --gzip
          --file "${{ runner.temp }}/built-packages.tar.gz"
          packages/*/dist packages/*/types data/dist

      - name: Pack immutable npm artifacts
        run: >-
          node ops/scripts/npm-release.js pack
          --plan .github/npm-release-plan.json
          --output npm-release-artifacts

      - name: Pack all Node compatibility artifacts
        run: >-
          node ops/scripts/package-node-compatibility.js pack
          --output "${{ runner.temp }}/package-node-artifacts"

      - name: Upload built test inputs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-built-packages
          path: ${{ runner.temp }}/built-packages.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload immutable npm artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-release-artifacts
          path: npm-release-artifacts/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload all Node compatibility artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-package-node-artifacts
          path: ${{ runner.temp }}/package-node-artifacts/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  tests:
    name: Release ${{ matrix.name }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: examples
            command: examples
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Download built test inputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-built-packages
          path: ${{ runner.temp }}/built-packages

      - name: Restore built test inputs
        run: tar --extract --gzip --file "${{ runner.temp }}/built-packages/built-packages.tar.gz"

      - name: Run ${{ matrix.name }}
        run: npm run turbo -- run "${{ matrix.command }}" --filter='./packages/**' --only

  package-node-compatibility:
    name: All packages / Node ${{ matrix.node-major }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pack.outputs.package_node_matrix) }}
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up package runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Report the isolated runtime
        run: |
          node --version
          npm --version

      - name: Download package compatibility artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-package-node-artifacts
          path: ${{ runner.temp }}/package-node-artifacts

      - name: Install, import, smoke-test and unit-test every eligible package
        run: >-
          node ops/scripts/package-node-compatibility.js verify
          --artifacts "${{ runner.temp }}/package-node-artifacts"
          --node-major "${{ matrix.node-major }}"
          --unit-concurrency 4

  publish:
    name: Publish to npm
    needs: [pack, tests, package-node-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Install the trusted-publishing npm version
        run: npm install --global npm@11.16.0

      - name: Download immutable npm artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-release-artifacts
          path: npm-release-artifacts

      - name: Publish and verify every planned package
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: >-
          node ops/scripts/npm-release.js publish
          --manifest npm-release-artifacts/manifest.json
          --concurrency 8

  tags:
    name: Push package tags
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact release revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Install the pinned npm version
        run: npm install --global npm@11.16.0

      - name: Download the published manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: npm-release-artifacts
          path: npm-release-artifacts

      - name: Configure the tag author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag the verified release
        run: >-
          node ops/scripts/npm-release.js tags
          --manifest npm-release-artifacts/manifest.json
          --push
          --remote origin
