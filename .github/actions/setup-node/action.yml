---
name: Setup Node and npm

description: Set up the repository's pinned Node.js and npm versions

inputs:
  cache:
    description: Cache npm's download directory
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: "./package-lock.json"
        package-manager-cache: false

    - name: Install the pinned npm version
      shell: bash
      run: |
        npm_spec="$(node ops/scripts/verify-root-toolchain.js --npm-spec)"
        npm install --global "$npm_spec"
        npm_root="$(npm root --global | tr -d '\r')"
        npm_cli="${npm_root%/}/npm/bin/npm-cli.js"
        node "$npm_cli" --version
        printf 'CODSEN_NPM_CLI=%s\n' "$npm_cli" >> "$GITHUB_ENV"

    - name: Verify and report the root toolchain
      shell: bash
      run: node ops/scripts/verify-root-toolchain.js
