---
name: Setup minimum IIFE browser

description: Install the exact Chromium runtime used by the browser IIFE contract

outputs:
  browser-path:
    description: Absolute path to the verified Chromium executable
    value: ${{ steps.install.outputs.browser-path }}
  browser-version:
    description: Chromium version the installed snapshot was cut from
    value: ${{ steps.install.outputs.browser-version }}

runs:
  using: composite
  steps:
    - name: Read the browser policy
      id: policy
      shell: bash
      # assign before writing: a command substitution inside an `echo` argument
      # discards its exit code, so a script which cannot even load would write
      # empty outputs and fail later as an unreadable curl error
      run: |
        archive_url="$(node ops/scripts/verify-browser-iifes.js --print-chromium-archive-url)"
        archive_sha256="$(node ops/scripts/verify-browser-iifes.js --print-chromium-archive-sha256)"
        executable_path="$(node ops/scripts/verify-browser-iifes.js --print-chromium-executable-path)"
        version="$(node ops/scripts/verify-browser-iifes.js --print-chromium-version)"
        if [ -z "$archive_url" ] || [ -z "$archive_sha256" ] ||
          [ -z "$executable_path" ] || [ -z "$version" ]; then
          echo "The browser policy printed an empty value" >&2
          exit 1
        fi
        {
          echo "archive_url=$archive_url"
          echo "archive_sha256=$archive_sha256"
          echo "executable_path=$executable_path"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"

    - name: Install Chromium 58 runtime libraries
      shell: bash
      # one package per library the content shell records as needed, plus the
      # tools which fetch and drive it. The shell links no GTK, so nothing here
      # pulls the GTK stack in on purpose: the desktop chrome from this same
      # snapshot cannot start against a modern pango, and this job is the reason
      # the policy pins the shell instead
      run: |
        test "$(uname -m)" = "x86_64"
        source /etc/os-release
        test "$VERSION_ID" = "22.04"
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          ca-certificates \
          curl \
          unzip \
          xvfb \
          fonts-liberation \
          libasound2 \
          libatk1.0-0 \
          libc6 \
          libdbus-1-3 \
          libexpat1 \
          libfontconfig1 \
          libgcc-s1 \
          libgconf-2-4 \
          libglib2.0-0 \
          libnspr4 \
          libnss3 \
          libpango-1.0-0 \
          libpangocairo-1.0-0 \
          libstdc++6 \
          libx11-6 \
          libx11-xcb1 \
          libxcb1 \
          libxcomposite1 \
          libxcursor1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxi6 \
          libxrandr2 \
          libxrender1 \
          libxss1 \
          libxtst6

    - name: Download and verify Chromium 58
      id: install
      shell: bash
      env:
        ARCHIVE_SHA256: ${{ steps.policy.outputs.archive_sha256 }}
        ARCHIVE_URL: ${{ steps.policy.outputs.archive_url }}
        EXECUTABLE_PATH: ${{ steps.policy.outputs.executable_path }}
        VERSION: ${{ steps.policy.outputs.version }}
      # the checksum is what identifies this build: the content shell has no
      # `--version` to ask, and the placeholder product it reports at runtime
      # names no version at all. A matching digest means these bytes are the
      # snapshot the policy pins, and the verifier then asserts from inside the
      # page that what runs the IIFEs is no newer than the floor
      run: |
        install_dir="$(mktemp -d "${RUNNER_TEMP}/codsen-chromium.XXXXXX")"
        archive="${install_dir}/content-shell.zip"
        curl --fail --location --silent --show-error \
          --retry 5 --retry-all-errors \
          --connect-timeout 30 --max-time 300 \
          --output "$archive" "$ARCHIVE_URL"
        echo "$ARCHIVE_SHA256  $archive" | sha256sum --check
        unzip -q "$archive" -d "$install_dir"
        browser_path="${install_dir}/${EXECUTABLE_PATH}"
        if [ ! -f "$browser_path" ]; then
          echo "The archive has no ${EXECUTABLE_PATH}" >&2
          exit 1
        fi
        chmod +x "$browser_path"
        if ldd "$browser_path" | grep "not found"; then
          echo "Chromium has unresolved runtime libraries" >&2
          exit 1
        fi
        echo "browser-path=$browser_path" >> "$GITHUB_OUTPUT"
        echo "browser-version=$VERSION" >> "$GITHUB_OUTPUT"
