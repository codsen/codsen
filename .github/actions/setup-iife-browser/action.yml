---
name: Setup minimum IIFE browser

description: Install the exact Chromium runtime used by the browser IIFE contract

outputs:
  chrome-path:
    description: Absolute path to the verified Chromium executable
    value: ${{ steps.install.outputs.chrome-path }}
  chrome-version:
    description: Verified Chromium version
    value: ${{ steps.install.outputs.chrome-version }}

runs:
  using: composite
  steps:
    - name: Read the browser policy
      id: policy
      shell: bash
      # assign before writing: a command substitution inside an `echo` argument
      # discards its exit code, so a script which cannot even load would write
      # empty outputs and fail later as an unreadable curl error
      run: |
        archive_url="$(node ops/scripts/verify-browser-iifes.js --print-chromium-archive-url)"
        archive_sha256="$(node ops/scripts/verify-browser-iifes.js --print-chromium-archive-sha256)"
        version="$(node ops/scripts/verify-browser-iifes.js --print-chromium-version)"
        if [ -z "$archive_url" ] || [ -z "$archive_sha256" ] || [ -z "$version" ]; then
          echo "The browser policy printed an empty value" >&2
          exit 1
        fi
        {
          echo "archive_url=$archive_url"
          echo "archive_sha256=$archive_sha256"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"

    - name: Install Chromium 58 runtime libraries
      shell: bash
      run: |
        test "$(uname -m)" = "x86_64"
        source /etc/os-release
        test "$VERSION_ID" = "22.04"
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          ca-certificates \
          curl \
          unzip \
          xvfb \
          fonts-liberation \
          xdg-utils \
          libc6 \
          libgcc-s1 \
          libstdc++6 \
          libasound2 \
          libatk1.0-0 \
          libcairo2 \
          libcups2 \
          libdbus-1-3 \
          libexpat1 \
          libfontconfig1 \
          libfreetype6 \
          libgconf-2-4 \
          libgdk-pixbuf-2.0-0 \
          libglib2.0-0 \
          libgtk2.0-0 \
          libnspr4 \
          libnss3 \
          libpango-1.0-0 \
          libpangocairo-1.0-0 \
          libx11-6 \
          libx11-xcb1 \
          libxcb1 \
          libxcomposite1 \
          libxcursor1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxi6 \
          libxrandr2 \
          libxrender1 \
          libxss1 \
          libxtst6

    - name: Download and verify Chromium 58
      id: install
      shell: bash
      env:
        ARCHIVE_SHA256: ${{ steps.policy.outputs.archive_sha256 }}
        ARCHIVE_URL: ${{ steps.policy.outputs.archive_url }}
        EXPECTED_VERSION: ${{ steps.policy.outputs.version }}
      run: |
        install_dir="$(mktemp -d "${RUNNER_TEMP}/codsen-chromium.XXXXXX")"
        archive="${install_dir}/chrome-linux.zip"
        curl --fail --location --silent --show-error \
          --retry 5 --retry-all-errors \
          --connect-timeout 30 --max-time 300 \
          --output "$archive" "$ARCHIVE_URL"
        echo "$ARCHIVE_SHA256  $archive" | sha256sum --check
        unzip -q "$archive" -d "$install_dir"
        chrome_path="${install_dir}/chrome-linux/chrome"
        chmod +x "$chrome_path"
        if ldd "$chrome_path" | grep "not found"; then
          echo "Chromium has unresolved runtime libraries" >&2
          exit 1
        fi
        actual_version="$("$chrome_path" --version)"
        test "$actual_version" = "Chromium $EXPECTED_VERSION"
        echo "chrome-path=$chrome_path" >> "$GITHUB_OUTPUT"
        echo "chrome-version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
